<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to repositories</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-identity" href="{{ site.baseurl }}/" aria-label="Repository Search home">
          <span class="site-identity__initials">SDH</span>
          <span class="site-identity__divider" aria-hidden="true"></span>
          <span class="site-identity__name">Repository Search</span>
        </a>
        <a
          class="astryx-icon-button site-header__github-link"
          href="{{ site.github.repository_url | default: 'https://github.com/sdhutchins/repository-search' }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View repository on GitHub"
          title="View repository on GitHub"
        >
          <svg class="astryx-icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.28 0 6.72-1.5 6.72-6.5a5.4 5.4 0 0 0-1.5-3.7A5.07 5.07 0 0 0 19.13 1S17.95.65 15 2.48a13.38 13.38 0 0 0-7 0C5.05.65 3.87 1 3.87 1a5.07 5.07 0 0 0-.09 3.3A5.4 5.4 0 0 0 2.28 8c0 5 3.44 6.5 6.72 6.5A4.8 4.8 0 0 0 8 18v4"></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
        </a>
      </div>
    </header>

    <main id="main-content" class="dashboard" tabindex="-1">
      {{ content }}
    </main>

    {% include scrolltop.html %}
    {% include page-footer.html %}
  </body>
</html>
